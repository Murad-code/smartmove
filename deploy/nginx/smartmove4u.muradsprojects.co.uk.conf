# Smart Move — nginx site for the host-installed nginx.
#
# Install as /etc/nginx/sites-available/smartmove4u.muradsprojects.co.uk and
# symlink into sites-enabled. Requires conf.d/smartmove-zones.conf.
#
# This is the plain-HTTP version. Run certbot once it is in place and certbot
# will add the TLS server block and the redirect itself:
#
#   sudo certbot --nginx -d smartmove4u.muradsprojects.co.uk
#
# The app listens on 127.0.0.1 only, so nginx is the only route in.

upstream smartmove_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name smartmove4u.muradsprojects.co.uk;

    # Property photographs are large; the CMS accepts up to 15 MB per file.
    client_max_body_size 20M;

    access_log /var/log/nginx/smartmove.access.log;
    error_log  /var/log/nginx/smartmove.error.log warn;

    # --- Security headers --------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Proxy defaults ----------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $smartmove_connection_upgrade;
    proxy_read_timeout 60s;

    # Next's build output is fingerprinted, so it can be cached forever.
    location /_next/static/ {
        proxy_pass http://smartmove_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://smartmove_app;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Uploaded property photographs.
    location /api/media/file/ {
        proxy_pass http://smartmove_app;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # The health check, so uptime monitoring never trips the form rate limit.
    location = /healthz {
        proxy_pass http://smartmove_app;
        access_log off;
    }

    # The admin panel. Never indexed, and rate limited against brute force.
    location /admin {
        limit_req zone=smartmove_admin burst=30 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://smartmove_app;
    }

    location / {
        # ---------------------------------------------------------------
        # Client preview protection.
        #
        # While this subdomain carries the demo properties, whose photographs
        # belong to another agency, keep it off the open web. Create the
        # password file with:
        #
        #   sudo apt-get install -y apache2-utils
        #   sudo htpasswd -c /etc/nginx/.htpasswd-smartmove smartmove
        #
        # then uncomment the two lines below and reload nginx. Delete them
        # once the site carries only Smart Move's own content.
        # ---------------------------------------------------------------
        # auth_basic "Smart Move preview";
        # auth_basic_user_file /etc/nginx/.htpasswd-smartmove;

        limit_req zone=smartmove_forms burst=10 nodelay;
        proxy_pass http://smartmove_app;
    }
}
