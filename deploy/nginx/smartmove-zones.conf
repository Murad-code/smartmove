# Smart Move — http-level directives.
#
# Install as /etc/nginx/conf.d/smartmove-zones.conf. These have to live in the
# http block, which is why they are separate from the site file.
#
# Every name is prefixed so it cannot collide with anything already configured
# for the other sites on this server.

# Enquiry forms are Next.js server actions, so they arrive as POSTs to ordinary
# page URLs. Keying on the method means only writes are counted and normal
# browsing is never throttled.
map $request_method $smartmove_write_key {
    default '';
    POST    $binary_remote_addr;
}

limit_req_zone $smartmove_write_key zone=smartmove_forms:10m rate=6r/m;
limit_req_zone $binary_remote_addr  zone=smartmove_admin:10m rate=60r/m;

# Required for websocket-style upgrades through the proxy.
map $http_upgrade $smartmove_connection_upgrade {
    default upgrade;
    ''      close;
}
