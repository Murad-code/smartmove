# Production stack for a single VPS, behind an nginx that is already installed
# on the host.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production pull
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Nothing here binds a public port. The app listens on 127.0.0.1 only, and the
# host's nginx terminates TLS and proxies to it. Postgres is not published at
# all, so it is reachable only from the app container.
#
# Each service declares both `image` and `build`, so the same file works two
# ways: `pull` fetches the image built by CI, and `build` produces it locally
# for testing. See docs/deployment.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-smartmove}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]
    logging: *logging

  app:
    image: ${APP_IMAGE:-ghcr.io/murad-code/smartmove:latest}
    build:
      context: .
      target: runner
      args:
        # Next inlines NEXT_PUBLIC_* at build time, so a locally built image
        # must be built with the same public URL it will be served on.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_ANALYTICS_PROVIDER: ${NEXT_PUBLIC_ANALYTICS_PROVIDER:-}
        NEXT_PUBLIC_ANALYTICS_ID: ${NEXT_PUBLIC_ANALYTICS_ID:-}
        NEXT_PUBLIC_PLAUSIBLE_HOST: ${NEXT_PUBLIC_PLAUSIBLE_HOST:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    # Localhost only. The host's nginx is the only way in.
    ports:
      - '127.0.0.1:${APP_PORT:-3001}:3000'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartmove}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env.production}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      # Runtime origin for emails and password-reset links. Next inlines
      # NEXT_PUBLIC_* at build time, so this must not rely on that value.
      SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      # Blocks crawlers and sends noindex. Leave true on a preview deployment.
      SITE_NOINDEX: ${SITE_NOINDEX:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_ANALYTICS_PROVIDER: ${NEXT_PUBLIC_ANALYTICS_PROVIDER:-}
      NEXT_PUBLIC_ANALYTICS_ID: ${NEXT_PUBLIC_ANALYTICS_ID:-}
      NEXT_PUBLIC_PLAUSIBLE_HOST: ${NEXT_PUBLIC_PLAUSIBLE_HOST:-}
      # unset = never seed. `true` = set up the site if it is empty, and do
      # nothing once it has content, so it is safe to leave on. `force` =
      # re-apply the seed on every boot, which overwrites the client's edits.
      RUN_SEED_ON_BOOT: ${RUN_SEED_ON_BOOT:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_PROPERTIES: ${SEED_DEMO_PROPERTIES:-false}
      SEED_DEMO_PROPERTIES_THIRD_PARTY_ACKNOWLEDGED: ${SEED_DEMO_PROPERTIES_THIRD_PARTY_ACKNOWLEDGED:-false}
    volumes:
      # Property photographs. Back this up alongside the database.
      - media:/app/media
      # Keeps the optimised-image cache across restarts.
      - next_cache:/app/.next/cache
    networks: [internal]
    logging: *logging

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  media:
  next_cache:
