# Local development stack.
#
# Only Postgres runs here; the application runs on the host with `pnpm dev` so
# hot reloading works. For the production stack see docker-compose.prod.yml.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartmove
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smartmove']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
