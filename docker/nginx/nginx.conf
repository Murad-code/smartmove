user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Property photographs are large; 25M leaves room for a full set.
    client_max_body_size 25M;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff2;

    # Enquiry forms are the only thing worth rate limiting at this layer; the
    # application limits them again per client. An empty key switches the limit
    # off, so page views are never throttled, only writes.
    map $request_method $write_limit_key {
        default $binary_remote_addr;
        GET     '';
        HEAD    '';
    }

    limit_req_zone $write_limit_key zone=forms:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=60r/m;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
