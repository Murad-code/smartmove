# Smart Move reverse proxy.
#
# Two deployment paths are supported. See docs/deployment.md.
#
#   A. Nginx terminates TLS with a Let's Encrypt certificate (recommended,
#      and what this file is set up for).
#   B. Cloudflare terminates TLS. In that case delete the 443 server block and
#      the redirect below, keep the port 80 block, and set Cloudflare's SSL
#      mode to "Full (strict)" with an origin certificate, or "Flexible" only
#      if the origin is otherwise locked down.
#
# Replace smartmove4u.co.uk with the real domain before deploying.

upstream smartmove_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name smartmove4u.co.uk www.smartmove4u.co.uk;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name smartmove4u.co.uk www.smartmove4u.co.uk;

    ssl_certificate     /etc/letsencrypt/live/smartmove4u.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartmove4u.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers --------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # --- Proxy defaults ----------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_buffering on;

    # Next's build output is fingerprinted, so it can be cached indefinitely.
    location /_next/static/ {
        proxy_pass http://smartmove_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Optimised images and uploaded media.
    location /_next/image {
        proxy_pass http://smartmove_app;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /api/media/file/ {
        proxy_pass http://smartmove_app;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # The admin panel. Rate limited, and never indexed.
    location /admin {
        limit_req zone=admin burst=30 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://smartmove_app;
    }

    # Server actions carry the enquiry forms. The zone's key is empty for GET
    # and HEAD, so only writes are counted.
    location / {
        limit_req zone=forms burst=10 nodelay;
        proxy_pass http://smartmove_app;
    }

    location = /healthz {
        proxy_pass http://smartmove_app;
        access_log off;
    }
}
